<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#181818" id="meta-theme-color" />

    <title>AWE.write</title>

    <link rel="manifest" href="./awewrite.webmanifest" />

    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32" />
    <link rel="shortcut icon" href="./appicon-192.png" sizes="192x192" />
    <link rel="shortcut icon" href="./appicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/properties.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/general.css" />
    <link rel="stylesheet" href="./css/editors.css" />
    <link rel="stylesheet" href="./css/toolbar.css" />
    <link rel="stylesheet" href="./css/toolbar-elements.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <link rel="stylesheet" href="./js/components/FontItem.css" />
    <link rel="stylesheet" href="./js/components/TextEditor.css" />
    <link rel="stylesheet" href="./js/components/ThemeItem.css" />
    <link rel="stylesheet" href="./js/components/WordCounter.css" />
    <link rel="stylesheet" href="./js/components/SettingsMenu.css" />
    <link rel="stylesheet" href="./js/components/SettingsMenuItem.css" />
    <link rel="stylesheet" href="./js/components/NumericSetting.css" />
  </head>

  <body>
    <div id="editors">
      <text-editor area="left"></text-editor>
      <text-editor area="right"></text-editor>
      <!-- <div id="left-box" class="textarea-box">
        <textarea id="left-textarea" data-area="left"></textarea>
        <div class="textarea-toolbar">
          <word-counter area="left" id="left-word-counter"></word-counter>
        </div>
      </div>

      <div id="right-box" class="textarea-box">
        <textarea id="right-textarea" data-area="right"></textarea>
        <div class="textarea-toolbar">
          <word-counter area="right" id="right-word-counter"></word-counter>
        </div>
      </div> -->
    </div>

    <div id="toolbar">
      <div class="toolbar-top-row">
        <div class="toolbar-left">
          <span class="toolbar-app-logo">
            <!-- start:svg-logo -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 439">
              <g id="Logo">
                <path

                />

                  d="M166.585,219.375C159.444,231.757 146.238,239.387 131.944,239.391C117.65,239.394 104.441,231.769 97.294,219.39C70.192,172.448 32.692,107.496 5.594,60.561C-1.551,48.185 -1.551,32.937 5.594,20.561C12.739,8.185 25.944,0.561 40.235,0.561C72.577,0.561 108.914,0.561 131.859,0.561C146.15,0.561 159.355,8.185 166.5,20.561C179.241,42.63 199.626,77.937 212.365,100.001C219.507,112.372 219.51,127.612 212.374,139.986C200.91,159.863 182.75,191.349 166.585,219.375Z"
                  style="fill-opacity: 0.6"
                />

                  d="M557.406,219.258C564.551,231.634 577.756,239.258 592.047,239.258C606.338,239.258 619.543,231.634 626.688,219.258C653.792,172.314 691.302,107.343 718.406,60.398C725.551,48.022 725.551,32.774 718.406,20.398C711.261,8.022 698.056,0.398 683.765,0.398C651.423,0.398 615.086,0.398 592.141,0.398C577.85,0.398 564.645,8.022 557.5,20.398C544.75,42.482 524.344,77.826 511.594,99.91C504.449,112.286 504.449,127.534 511.594,139.91C523.067,159.781 541.235,191.25 557.406,219.258Z"

                />
              </g>
            </svg>
            <!-- end:svg-logo -->
          </span>
          <span id="toolbar-title">AWE.write</span>
          <div class="expand-toolbar-button" data-toolbar="data">Data</div>
          <div class="expand-toolbar-button" data-toolbar="layout">Layout</div>
          <div class="expand-toolbar-button" data-toolbar="font">Font</div>
          <div class="expand-toolbar-button" data-toolbar="background">Theme</div>
          <div class="expand-toolbar-button" data-toolbar="about">About</div>
        </div>

        <div class="toolbar-right">
          <span id="clock"></span>
        </div>
      </div>

      <div class="toolbar-bottom-row">
        <div class="toolbar-bottom-content" id="toolbar-data">
          <div class="toolbar-subline">
            <h3>Actions</h3>
            <button class="switch-texts-button" type="button">switch texts</button>
            <button class="clear-texts-button" type="button">clear texts</button>
            <h3>Settings</h3>
            <input type="checkbox" id="spellcheck" />
            <label for="spellcheck">Enable spellchecking</label>
          </div>
        </div>
        <div class="toolbar-bottom-content" id="toolbar-font">
          <div class="toolbar-subline">
            <h3>Font size</h3>
            <span id="toolbar-fontsize" class="toolbar-num-value">12</span>
            <span class="toolbar-buttonset">
              <button class="icon-button" id="toolbar-fontsize-dec" type="button">-</button>
              <button class="icon-button" id="toolbar-fontsize-inc" type="button">+</button>
            </span>
            <h3>Line height</h3>
            <span id="toolbar-lineheight" class="toolbar-num-value">1.2</span>
            <span class="toolbar-buttonset">
              <button class="icon-button" id="toolbar-lineheight-dec" type="button">-</button>
              <button class="icon-button" id="toolbar-lineheight-inc" type="button">+</button>
            </span>
          </div>
        </div>
        <div class="toolbar-bottom-content" id="toolbar-layout">
          <div class="toolbar-subline">
            <h3>Editor layout</h3>
            <span class="toolbar-buttonset">
              <button class="change-textbox-layout-button" data-value="max-left" type="button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-panel-right-dashed-icon lucide-panel-right-dashed"
                >
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M15 14v1" />
                  <path d="M15 19v2" />
                  <path d="M15 3v2" />
                  <path d="M15 9v1" />
                </svg>
              </button>
              <button class="change-textbox-layout-button" data-value="focus-left" type="button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-panel-right-icon lucide-panel-right"
                >
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M15 3v18" />
                </svg>
              </button>
              <button class="change-textbox-layout-button" data-value="default" type="button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-columns2-icon lucide-columns-2"
                >
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M12 3v18" />
                </svg>
              </button>
              <button class="change-textbox-layout-button" data-value="focus-right" type="button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-panel-left-icon lucide-panel-left"
                >
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M9 3v18" />
                </svg>
              </button>
              <button class="change-textbox-layout-button" data-value="max-right" type="button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-panel-left-dashed-icon lucide-panel-left-dashed"
                >
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M9 14v1" />
                  <path d="M9 19v2" />
                  <path d="M9 3v2" />
                  <path d="M9 9v1" />
                </svg>
              </button>
            </span>
            <h3>Text width</h3>
            <span class="toolbar-buttonset">
              <input
                type="radio"
                name="textwidth"
                class="change-text-width-button"
                data-text-width="narrow"
                id="toolbar-textwidth-narrow"
              />
              <label for="toolbar-textwidth-narrow">Narrow</label>
              <input
                type="radio"
                name="textwidth"
                class="change-text-width-button"
                data-text-width="medium"
                id="toolbar-textwidth-medium"
              />
              <label for="toolbar-textwidth-medium">Medium</label>
              <input
                type="radio"
                name="textwidth"
                class="change-text-width-button"
                data-text-width="wide"
                id="toolbar-textwidth-wide"
              />
              <label for="toolbar-textwidth-wide">Wide</label>
              <input
                type="radio"
                name="textwidth"
                class="change-text-width-button"
                data-text-width="full"
                id="toolbar-textwidth-full"
              />
              <label for="toolbar-textwidth-full">Full</label>
            </span>
          </div>
        </div>
        <div class="toolbar-bottom-content" id="toolbar-background">
          <div class="toolbar-subline">
            <h3>Colors</h3>
            <span class="toolbar-buttonset">
              <button class="open-sidebar-button" data-sidebar="themes-light" type="button">
                Light
              </button>
              <button class="open-sidebar-button" data-sidebar="themes-dark" type="button">
                Dark
              </button>
            </span>
            <h3>Images</h3>
            <span class="toolbar-buttonset">
              <button class="open-sidebar-button" data-sidebar="themes-photos" type="button">
                Photos
              </button>
              <button class="open-sidebar-button" data-sidebar="themes-abstract" type="button">
                Abstract
              </button>
              <button class="open-sidebar-button" data-sidebar="themes-approx.art" type="button">
                approx.art
              </button>
            </span>
          </div>
        </div>
        <div class="toolbar-bottom-content" id="toolbar-about">
          <div class="toolbar-subline">
            <span class="infotext">Version 1.23</span>
            <span class="infotext"> <a href="/" target="_blank">Website and changelog</a> </span>
            <span class="infotext">
              <a href="https://github.com/alinnert/awewrite" target="_blank">Source code</a>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div class="sidebar-content" id="sidebar-fonts">
        <h1>Fonts</h1>

        <h2>Sans Serif</h2>
        <div class="font-list">
          <font-item font="IBM Plex Sans" label="IBM Plex Sans"></font-item>
          <font-item font="Noto Sans" label="Noto Sans"></font-item>
        </div>

        <h2>Serif</h2>
        <div class="font-list">
          <font-item font="IBM Plex Serif" label="IBM Plex Serif"></font-item>
          <font-item font="Noto Serif" label="Noto Serif"></font-item>
          <font-item font="Merriweather" label="Merriweather"></font-item>
        </div>

        <h2>Monospace</h2>
        <div class="font-list">
          <font-item font="IBM Plex Mono" label="IBM Plex Mono"></font-item>
          <font-item font="JetBrains Mono" label="JetBrains Mono"></font-item>
          <font-item font="Monaspace Radon" label="Monaspace Radon"></font-item>
          <font-item font="Duo" label="iA Writer Duo"></font-item>
          <font-item font="Quattro" label="iA Writer Quattro"></font-item>
        </div>

        <h2>Other fonts</h2>
        <div class="font-list">
          <font-item font="Kalam" label="Kalam"></font-item>
          <font-item font="OpenDyslexic" label="Open Dyslexic"></font-item>
        </div>
      </div>

      <div
        class="sidebar-content sidebar-theme-group"
        id="sidebar-themes-light"
        data-theme-group="light"
      ></div>
      <div
        class="sidebar-content sidebar-theme-group"
        id="sidebar-themes-dark"
        data-theme-group="dark"
      ></div>
      <div
        class="sidebar-content sidebar-theme-group"
        id="sidebar-themes-photos"
        data-theme-group="photos"
      ></div>
      <div
        class="sidebar-content sidebar-theme-group"
        id="sidebar-themes-abstract"
        data-theme-group="abstract"
      ></div>
      <div
        class="sidebar-content sidebar-theme-group"
        id="sidebar-themes-approx.art"
        data-theme-group="approx.art"
      ></div>
    </div>

    <script src="./js/index.ts" type="module"></script>
  </body>
</html>
